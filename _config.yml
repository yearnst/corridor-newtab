# GitHub Pages site configuration
# index.html is the home page (a static file, not run through Jekyll templates);
# the other .md documents (README / PRIVACY / CHANGELOG …) are rendered by Jekyll with the primer theme.

title: Corridor
description: Open a new tab. See a work of art. 106 public-domain masterpieces · bilingual curatorial notes · five viewing modes · works offline once installed.
lang: en
theme: jekyll-theme-primer

# Essential: without this, kramdown prints the Markdown inside the README's top <div align="center">
# as plain text (title, badges and navigation all collapse into one lump).
kramdown:
  parse_block_html: true

# Note: GitHub Pages enables jekyll-optional-front-matter by default, and it has a hard-coded
# FILENAME_BLACKLIST — README / LICENSE / LICENCE / COPYING / CODE_OF_CONDUCT /
# CONTRIBUTING / ISSUE_TEMPLATE / PULL_REQUEST_TEMPLATE never become .html,
# so don't link to them within the site (link CONTRIBUTING and the like to the source files on GitHub).
# A README.md inside a folder becomes that folder's index through jekyll-readme-index,
# so the full manual lives at corridor-newtab/, not corridor-newtab/README.html.
# README.zh-CN.md is not on that list, so the Chinese manual is corridor-newtab/README.zh-CN.html.

defaults:
  - scope:
      path: ""
    values:
      layout: default
