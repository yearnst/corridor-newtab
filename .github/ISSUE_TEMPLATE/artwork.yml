name: 🖼 Suggest a painting / report a correction · 推荐一幅画 / 勘误
description: Suggest a public-domain work worth adding, or point out wrong information about a work · 推荐值得收进来的公有领域作品，或指出某幅画的信息写错了
labels: ["artwork"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Type · 类型
      options:
        - Suggest a new work · 推荐新作品
        - Wrong information on an existing work · 现有作品信息有误
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: Title of the work · 作品标题
      placeholder: "The Starry Night / 星月夜"
    validations:
      required: true
  - type: input
    id: commons
    attributes:
      label: Wikimedia Commons link · Wikimedia Commons 链接
      description: Required when suggesting a new work; the image must be on upload.wikimedia.org and marked as public domain · 推荐新作品时必填，图片须在 upload.wikimedia.org 上且标注为公有领域
      placeholder: "https://commons.wikimedia.org/wiki/File:..."
  - type: textarea
    id: detail
    attributes:
      label: Details · 详细说明
      description: |
        For a correction, say clearly “what it says now and what it should say”, with an authoritative source (the museum's website, a Wikidata entry).
        For a suggestion, say in a sentence why it belongs here — works in this project aren't chosen for fame, but for how they look on a wall.
        勘误请写清「现在是什么、应该是什么」，并附一个权威出处（美术馆官网、Wikidata 条目）。
        推荐作品请说一句为什么值得收——这个项目挑画不看名气，看的是「挂在墙上好不好看」。
    validations:
      required: true
  - type: checkboxes
    id: pd
    attributes:
      label: Copyright · 版权
      options:
        - label: I confirm that this work and its scan are in the public domain · 我确认这幅作品及其扫描件已进入公有领域
