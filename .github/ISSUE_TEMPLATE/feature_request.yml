name: 💡 Suggest an idea · 提一个想法
description: A new display mode, a new frame, a new setting · 想要一种新的呈现方式、新的画框、新的设置项
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What's the situation? · 你遇到的是什么情况
      description: Start with the problem, then the solution — that makes it easier to find an approach even better than the one you had in mind · 先说困扰，再说方案——这样更容易找到比你想的更好的做法
      placeholder: "I set the wall to a dark color, but the label is still black text on a light card, and it's glaring"
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like it to become? · 你希望它变成什么样
    validations:
      required: true
  - type: textarea
    id: refs
    attributes:
      label: Anything to go by? · 有参照物吗
      description: Photos of a real gallery, screenshots of other software, or just a description · 真实展厅的照片、别的软件的截图、一段描述都行
  - type: checkboxes
    id: scope
    attributes:
      label: Please confirm · 确认一下
      options:
        - label: This idea doesn't need any new browser permission (new permissions affect store review and need a separate discussion) · 这个想法不需要新增任何浏览器权限（新增权限会影响商店审核，需要单独讨论）
        - label: This idea doesn't need to reach any server other than Wikimedia · 这个想法不需要联网到 Wikimedia 以外的服务器
