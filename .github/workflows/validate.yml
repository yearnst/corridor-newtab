name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: ver
        run: |
          V=$(sed -n 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' corridor-newtab/manifest.json | head -1)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "manifest version: $V"

      - name: Static checks (JSON, icons, CSP, eval)
        run: |
          python3 -m json.tool corridor-newtab/manifest.json > /dev/null
          python3 -m json.tool corridor-newtab/data/catalog.json > /dev/null
          for L in corridor-newtab/_locales/*/messages.json; do python3 -m json.tool "$L" > /dev/null; done
          for S in 16 32 48 128; do test -f "corridor-newtab/icons/$S.png" || { echo "::error::icons/$S.png is missing"; exit 1; }; done
          if grep -rnE '(^|[^a-zA-Z.])eval\(|new Function\(' corridor-newtab/src; then
            echo "::error::eval / new Function found in the source"; exit 1
          fi
          grep -q "script-src 'self'" corridor-newtab/manifest.json || {
            echo "::error::script-src in the CSP is not 'self'"; exit 1
          }
          echo "Checks passed"

      - name: manifest permissions have not quietly grown
        run: |
          # Only these five permanent permissions are allowed; any addition has to be explained in the PR and added to this list.
          # declarativeNetRequestWithHostAccess was added in v1.20.0 and is used for one thing only:
          # rewriting the Origin header of requests sent to **local addresses** (localhost / 127.x / 0.0.0.0 / ::1 / *.local)
          # to that address itself, so that local services such as Ollama pass their origin check.
          # The WithHostAccess suffix means it only takes effect on addresses the user has granted, with no extra prompt at install;
          # the rule is also locked to this extension's own requests with initiatorDomains. See src/localnet.js.
          EXPECTED='alarms declarativeNetRequestWithHostAccess downloads storage unlimitedStorage'
          ACTUAL=$(python3 -c "
          import json
          m=json.load(open('corridor-newtab/manifest.json'))
          print(' '.join(sorted(m.get('permissions',[]))))
          ")
          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"
          [ "$ACTUAL" = "$EXPECTED" ] || {
            echo "::error::The permanent permissions changed. This directly affects Chrome Web Store review; explain why in the PR and update this check."
            exit 1
          }

      - name: Optional permissions have not quietly grown
        run: |
          # Optional permissions show no warning at install and don't disable existing users — which is exactly why they need watching:
          # topSites and tabs are both site sources for the Pause Gallery screen — one reads Chrome's most-visited list,
          # the other reads the tabs open in the current profile (titles and URLs only, summarized by site).
          # Both are requested only when the user clicks to grant them, and can be revoked in the panel at any time.
          python3 - <<'PY'
          import json, sys
          m = json.load(open('corridor-newtab/manifest.json'))
          want = ["topSites", "tabs"]
          got = m.get("optional_permissions", [])
          if sorted(got) != sorted(want):
              print(f"::error::optional_permissions changed: {sorted(got)} (expected {sorted(want)})")
              sys.exit(1)
          print("optional_permissions OK")
          PY

      - name: host permissions still limited to the three Wikimedia domains
        run: |
          python3 - <<'PY'
          import json, sys
          m = json.load(open('corridor-newtab/manifest.json'))
          want = {"https://upload.wikimedia.org/*",
                  "https://commons.wikimedia.org/*",
                  "https://www.wikidata.org/*"}
          got = set(m.get("host_permissions", []))
          if got != want:
              print(f"::error::host_permissions changed: {sorted(got)}")
              sys.exit(1)
          print("host_permissions OK")
          PY

      - name: Catalog integrity
        run: |
          python3 - <<'PY'
          import json, sys
          items = json.load(open('corridor-newtab/data/catalog.json'))
          print(f"The catalog has {len(items)} entries")
          required = ['id','title','artist','life','year','ys','medium','dims','museum',
                      'place','movement','region','tags','mature','format','note','look',
                      'img','src','vis']
          bad, seen = 0, set()
          for i, w in enumerate(items):
              wid = w.get('id', f'#{i}')
              missing = [k for k in required if k not in w]
              if missing:
                  print(f"::error::{wid} is missing fields: {missing}"); bad += 1
              if wid in seen:
                  print(f"::error::duplicate id: {wid}"); bad += 1
              seen.add(wid)
              base = w.get('img', {}).get('base', '')
              full = w.get('img', {}).get('full', '')
              for u in (base, full):
                  if u and not u.startswith('https://upload.wikimedia.org/'):
                      print(f"::error::{wid} has an image outside upload.wikimedia.org: {u}"); bad += 1
              lic = w.get('src', {}).get('licence', '')
              if 'public domain' not in lic.lower() and not lic.upper().startswith('PDM'):
                  print(f"::error::{wid} is not licensed as public domain: {lic!r}"); bad += 1
          print("All passed" if not bad else f"{bad} problems")
          sys.exit(1 if bad else 0)
          PY

