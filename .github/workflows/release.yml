name: Release

# Pushing a tag that starts with "v" packages the extension, creates a Release and attaches the zip.
# The release notes are taken from CHANGELOG.md:
#   git tag v1.19.1 && git push origin v1.19.1

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v1.19.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          V="${TAG#v}"
          M=$(sed -n 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' corridor-newtab/manifest.json | head -1)
          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"
          echo "version=$V"   >> "$GITHUB_OUTPUT"
          if [ "$V" != "$M" ]; then
            echo "::error::The tag is $TAG, but manifest.json says $M. The two must match."
            exit 1
          fi

      - name: Package
        run: |
          V="${{ steps.ver.outputs.version }}"
          ZIP="$PWD/dist/corridor-newtab-v$V.zip"
          mkdir -p dist
          # Flat package: manifest.json must sit at the root of the zip, so zip from inside the extension folder.
          # Both manuals (README.md and README.<lang>.md) stay out of the package.
          ( cd corridor-newtab && zip -r -q -X "$ZIP" . \
              -x 'README.md' 'README.*.md' '.DS_Store' '*/.DS_Store' '._*' '*/._*' '__MACOSX/*' '*.map' '*.zip' 'node_modules/*' )
          LIST="$(unzip -l "$ZIP")"
          echo "$LIST" | tail -1
          case "$LIST" in
            *" manifest.json"*) echo "✓ manifest.json is at the root" ;;
            *) echo "::error::manifest.json is not at the root of the zip; Chrome will reject it"; exit 1 ;;
          esac

      - name: Take this version's notes from CHANGELOG
        id: notes
        run: |
          V="${{ steps.ver.outputs.version }}"
          {
            echo "notes<<CHANGELOG_EOF"
            awk -v v="## [$V]" '
              index($0, v)==1 {f=1; next}
              f && /^## \[/ {exit}
              f {print}
            ' CHANGELOG.md
            echo ""
            echo "---"
            echo ""
            echo "**Install**: download the zip below and unzip it. Open \`chrome://extensions/\`, turn on Developer mode,"
            echo "click **Load unpacked** and choose the unzipped folder;"
            echo "or clone this repository and choose \`corridor-newtab/\` directly."
            echo ""
            echo "Full manual: [corridor-newtab/README.md](../../blob/main/corridor-newtab/README.md)."
            echo ""
            echo "<details>"
            echo "<summary>中文</summary>"
            echo ""
            echo "**安装**：下载下方的 zip 并解开，在 \`chrome://extensions/\` 打开开发者模式，"
            echo "「加载已解压的扩展程序」选解开后的那个文件夹；"
            echo "或者 clone 本仓库，直接选 \`corridor-newtab/\`。"
            echo ""
            echo "完整说明见 [corridor-newtab/README.zh-CN.md](../../blob/main/corridor-newtab/README.zh-CN.md)。"
            echo ""
            echo "</details>"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create the Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Corridor ${{ steps.ver.outputs.tag }}
          body: ${{ steps.notes.outputs.notes }}
          files: dist/*.zip
          draft: false
          prerelease: false
